packages:
  - apps/*
  - packages/*

# Dependency install scripts stay blocked. These packages work without theirs:
# esbuild's binary arrives as an optional dependency, and the Prisma CLI fetches
# its schema engine on first use.
allowBuilds:
  '@prisma/engines': false
  esbuild: false
  prisma: false

# One Zod version for every workspace: schemas cross package boundaries,
# so two copies would break instanceof checks and type identity.
catalog:
  zod: ^4.6.5
